version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: python run.py
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: unless-stopped