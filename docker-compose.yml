version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    command: python run.py
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app
    restart: unless-stopped