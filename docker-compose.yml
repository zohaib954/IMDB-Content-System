version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: python run.py
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: